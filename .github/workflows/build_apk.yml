name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Create Complete Flutter Project Structure
        run: |
          # Android folder generate karein
          flutter create /tmp/base_app --project-name attendance_app --platforms=android --org com.rudrapandey.attendance
          cp -r /tmp/base_app/android $GITHUB_WORKSPACE/
          
          # Android gradle minSdk update karein (tflite/camera ke liye zaruri)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true

          # Sahi packages ke sath pubspec.yaml likhein
          cat << 'EOF' > $GITHUB_WORKSPACE/pubspec.yaml
          name: attendance_app
          description: "Attendance App built with Flutter"
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            image: ^3.3.0
            tflite_flutter: ^0.10.4
            camera: ^0.10.5+9
            google_mlkit_face_detection: ^0.11.0
            path_provider: ^2.1.3
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
