name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Android & Firebase Configuration
        run: |
          rm -rf android
          flutter create --platforms=android --project-name attendance_app --org com.example .

          # AndroidX Enable
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # Firebase minSdkVersion 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

          # Root settings.gradle mein Google Services plugin declare karein (Flutter 3.24+ standard)
          sed -i '/id "dev.flutter.flutter-plugin-loader"/a \    id "com.google.gms.google-services" version "4.4.1" apply false' android/settings.gradle || true

          # App build.gradle mein Google Services plugin apply karein
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle || true

          # google-services.json copy karein
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Attendance-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
