name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Configure Android & Google Services
        run: |
          rm -rf android
          flutter create --platforms=android --project-name attendance_app --org com.example .

          # AndroidX aur JVM memory settings
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096M" >> android/gradle.properties

          # MinSdkVersion set karein
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

          # 1. settings.gradle me Google Services plugin declare karein
          cat << 'EOF' >> android/settings.gradle

          pluginManagement {
              plugins {
                  id "com.google.gms.google-services" version "4.4.1" apply false
              }
          }
          EOF

          # 2. app/build.gradle ke plugins block me add karein
          if grep -q "plugins {" android/app/build.gradle; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle
          else
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi

          # 3. google-services.json copy karein
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Attendance-App
          path: build/app/outputs/flutter-apk/app-release.apk
