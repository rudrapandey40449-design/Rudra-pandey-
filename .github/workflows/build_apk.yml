 name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Create Complete Flutter Project Structure
        run: |
          # Fresh valid project structure generate karein
          flutter create /tmp/base_app --project-name attendance_app --platforms=android --org com.rudrapandey.attendance
          
          # Android folder aur missing files copy karein
          cp -r /tmp/base_app/android $GITHUB_WORKSPACE/
          
          # Root me bilkul fresh aur valid pubspec.yaml likhein
          cat << 'EOF' > $GITHUB_WORKSPACE/pubspec.yaml
          name: attendance_app
          description: "Attendance App built with Flutter"
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
